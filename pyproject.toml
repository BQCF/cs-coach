[project]
name = "cs-coach"
version = "0.1.0"
description = "CS2 demo 离线体检：死亡归因 / 站位暴露面 / 职业基准"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.15"
dependencies = [
    "awpy[plot]>=3.1,<4",
    "polars>=2,<3",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
csc = "csc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# no:cacheprovider：沙箱里 .pytest_cache 会被 0o700 DACL 锁死（见 tests/conftest.py）
addopts = "-q -p no:cacheprovider"
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["csc"]
